name: GhostTrace quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked development tools
        run: npm ci
      - name: Dependency audit
        run: npm audit
      - name: Lint and UI regression tests
        run: |
          npm run lint
          npm run test:ui
      - name: Install local evidence extractors
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils tesseract-ocr
      - name: Compile
        run: python -m compileall -q code
      - name: Test
        run: python -m unittest discover -s code/tests -v
      - name: Build production snapshot
        run: npm run build
      - name: Generate and validate all decisions
        run: |
          python code/main.py run
          python code/main.py validate
      - name: Evaluate public sample
        run: python code/evaluation/main.py
      - name: Verify submission package
        run: |
          python code/package_submission.py
          unzip -t code.zip
